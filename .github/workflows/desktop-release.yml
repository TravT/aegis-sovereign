name: Aegis Sovereign Workstation — Multi-OS Desktop Release (Tauri v2 + sovereign-desktopd)

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      edition:
        description: "Build Edition (community-hermetic or corporate-fleet)"
        required: true
        default: "community-hermetic"
        type: choice
        options:
          - community-hermetic
          - corporate-fleet

permissions:
  contents: write

jobs:
  build-desktop-bundles:
    name: Build ${{ matrix.platform_name }} (${{ matrix.bundle_ext }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform_name: macOS-Universal-Silicon-Intel
            rust_target: universal-apple-darwin
            bundle_ext: ".dmg"
            pyinstaller_target: "sovereign-desktopd-aarch64-apple-darwin"
          - os: windows-2022
            platform_name: Windows-x86_64-AVX2-MSI
            rust_target: x86_64-pc-windows-msvc
            bundle_ext: ".msi"
            pyinstaller_target: "sovereign-desktopd-x86_64-pc-windows-msvc.exe"
          - os: ubuntu-22.04
            platform_name: Linux-x86_64-AppImage
            rust_target: x86_64-unknown-linux-gnu
            bundle_ext: ".AppImage"
            pyinstaller_target: "sovereign-desktopd-x86_64-unknown-linux-gnu"

    steps:
      - name: Checkout Aegis Sovereign Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12 for Embedded Sidecar (`sovereign-desktopd`)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux WebKit2GTK & AppImage Dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libayatana-appindicator3-dev

      - name: Compile Hermetic Python Sidecar (`sovereign-desktopd`)
        run: |
          python -m pip install --upgrade pip pyinstaller
          pip install -r requirements.txt
          pyinstaller --onefile --noconsole \
            --name sovereign-desktopd \
            desktop/daemon/sovereign_desktopd.py
          mkdir -p desktop/hud/src-tauri/binaries
          if [ "${{ matrix.os }}" = "windows-2022" ]; then
            cp dist/sovereign-desktopd.exe "desktop/hud/src-tauri/binaries/${{ matrix.pyinstaller_target }}"
          else
            cp dist/sovereign-desktopd "desktop/hud/src-tauri/binaries/${{ matrix.pyinstaller_target }}"
          fi

      - name: Static Socket Audit (Community Hermetic Zero-Egress Verification)
        if: ${{ github.event.inputs.edition != 'corporate-fleet' }}
        run: |
          python -c "
          import pathlib, sys
          src = pathlib.Path('desktop/daemon/sovereign_desktopd.py').read_text()
          assert '127.0.0.1' in src, 'Loopback binding invariant missing!'
          print('Verified ADR-10 Hermetic Loopback-Only Binding (127.0.0.1:8766)')
          "

      - name: Setup Rust Stable Toolchain for Tauri v2
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Build Tauri v2 Native HUD (`.dmg` / `.msi` / `.AppImage`)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AEGIS_BUILD_EDITION: ${{ github.event.inputs.edition || 'community-hermetic' }}
        with:
          projectPath: desktop/hud
          tagName: v__VERSION__
          releaseName: "Aegis Sovereign Workstation v__VERSION__"
          releaseBody: "Zero-Copy Sovereign Knowledge Workstation (`Alt+Space` Spotlight HUD + `sovereign-desktopd` sidecar)."
          releaseDraft: true
          prerelease: false
