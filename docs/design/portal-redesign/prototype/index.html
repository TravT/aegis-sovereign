  <script>
  /* PROTOTYPE switcher: ?variant= drives which variant mounts; arrows + <-/-> keys cycle (not while typing). */
  (function () {
    const keys = ["A", "B", "C"];
    const p = new URLSearchParams(location.search);
    let v = (p.get("variant") || "A").toUpperCase(); if (!keys.includes(v)) v = "A";
    if (p.get("bar") === "0") document.body.classList.add("no-bar");
    const def = PROTO.VARIANTS[v];
    document.getElementById("pb-label").textContent = v + " — " + def.name;
    document.title = "Aegis prototype " + v;
    def.mount(document.getElementById("app"), { screen: p.get("screen") || "home" });
    function go(delta) {
      const next = keys[(keys.indexOf(v) + delta + keys.length) % keys.length];
      const q = new URLSearchParams(location.search); q.set("variant", next); q.delete("screen");
      location.search = q.toString();
    }
    document.getElementById("pb-prev").onclick = () => go(-1);
    document.getElementById("pb-next").onclick = () => go(1);
    document.getElementById("pb-hide").onclick = () => document.body.classList.add("no-bar");
    window.addEventListener("keydown", (e) => {
      const t = document.activeElement;
      if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT" || t.isContentEditable)) return;
      if (e.key === "ArrowLeft" && !e.metaKey && !e.ctrlKey) go(-1);
      if (e.key === "ArrowRight" && !e.metaKey && !e.ctrlKey) go(1);
    });
  })();
  </script>
